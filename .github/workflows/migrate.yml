name: Migrar Michel Food House

on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar projeto legado
        run: git clone --depth 1 --branch main https://github.com/Alexandre802/teste.git /tmp/fonte

      - name: Copiar somente Michel Food House
        run: |
          rm -rf app components lib public scripts e2e
          cp -R /tmp/fonte/app ./app
          cp -R /tmp/fonte/components ./components
          cp -R /tmp/fonte/lib ./lib
          mkdir -p public
          for item in images lanche marca produtos icones; do
            if [ -e "/tmp/fonte/public/$item" ]; then cp -R "/tmp/fonte/public/$item" "./public/$item"; fi
          done
          for item in sw.js og.png favicon.ico; do
            if [ -e "/tmp/fonte/public/$item" ]; then cp "/tmp/fonte/public/$item" "./public/$item"; fi
          done
          if [ -d /tmp/fonte/scripts ]; then cp -R /tmp/fonte/scripts ./scripts; fi
          for f in .env.example .gitignore eslint.config.mjs next.config.ts package.json package-lock.json postcss.config.mjs proxy.ts tsconfig.json; do
            if [ -f "/tmp/fonte/$f" ]; then cp "/tmp/fonte/$f" "./$f"; fi
          done
          cat > MIGRACAO.md <<'EOF'
          # Michel Food House — repositório isolado
          Este repositório contém somente o projeto Michel Food House. Demos de VetCare, advocacia, estética, odontologia e arquivos de referência do antigo monorepositório não são copiados.
          EOF

      - name: Registrar migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migra Michel Food House sem dados de outros projetos" || exit 0
          git push origin main
